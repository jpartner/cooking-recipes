baseURL = "https://jpartner.github.io/cooking-recipes/"
defaultContentLanguage = "en"
title = "Cooking Recipes"
theme = "hugo-book"

[params]
  BookTheme = "light"
  BookToC = true
  BookSearch = false
  BookSection = "/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[languages]
  [languages.en]
    label = "English"
    locale = "en"
    weight = 1
  [languages.pl]
    label = "Polski"
    locale = "pl"
    title = "Przepisy kulinarne"
    weight = 2
  [languages.uk]
    label = "Українська"
    locale = "uk"
    title = "Кулінарні рецепти"
    weight = 3
