baseURL = "https://jpartner.github.io/cooking-recipes/"
defaultContentLanguage = "en"
title = "Cooking Recipes"
theme = "hugo-book"

[params]
  BookTheme = "light"
  BookToC = true
  BookSearch = false
  BookSection = "/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 1
  [languages.pl]
    languageName = "Polski"
    languageCode = "pl"
    title = "Przepisy kulinarne"
    weight = 2
